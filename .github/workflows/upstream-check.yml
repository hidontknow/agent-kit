name: Upstream check

# Weekly: compare collected items (sources.json) with their upstream repos
# and keep a single tracking issue up to date.
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check upstream
        id: check
        run: |
          node bin/agent-kit.js outdated --json > outdated.json
          node -e '
            const r = require("./outdated.json").filter(x => !["up-to-date","local-modified"].includes(x.state));
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${r.length}\n`);
            const body = ["The following collected items differ from upstream:", "",
              "| item | state | upstream | commits |", "| --- | --- | --- | --- |",
              ...r.map(x => `| \`${x.id}\` | ${x.state} | ${x.repo}/${x.path} | ${x.commits.length} |`), "",
              "Review with `agent-kit diff <item>` and apply with `agent-kit update <item>`."].join("\n");
            fs.writeFileSync("body.md", body);
          '
      - name: Open or update tracking issue
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream updates available for collected items"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
