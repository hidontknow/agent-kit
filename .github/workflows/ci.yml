name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate items
        run: node bin/agent-kit.js validate
      - name: Generated files are up to date
        run: node bin/agent-kit.js build --check
      - name: Tests
        run: node --test test/*.test.js
